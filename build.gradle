plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // Bundled into the mod jar via Jar-in-Jar; also needed on the dev run classpath.
    jarJar(implementation("org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"))
    additionalRuntimeClasspath "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"

    // Optional integrations; only touched when the mod is loaded
    compileOnly "maven.modrinth:ae2:${ae2_modrinth_version}"
    compileOnly "maven.modrinth:refined-storage:${refined_storage_modrinth_version}"
    compileOnly 'org.apiguardian:apiguardian-api:1.1.2' // annotations used by RS's API
    compileOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_modrinth_version}"
    compileOnly "maven.modrinth:sophisticated-core:${sophisticated_core_modrinth_version}"
    compileOnly "maven.modrinth:create:${create_modrinth_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Copies the built jar into the Arclight test server (../server/mods), replacing older builds.
var testServerMods = rootProject.file('../server/mods')

var cleanTestServerMods = tasks.register('cleanTestServerMods', Delete) {
    delete fileTree(testServerMods) { include "${mod_id}-*.jar" }
}

tasks.register('deployToTestServer', Copy) {
    group = 'modlog'
    description = 'Builds the mod and copies it into the Arclight test server.'
    dependsOn cleanTestServerMods
    from tasks.named('jar')
    into testServerMods
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
